syntax = "proto2";

import "enums.proto";

option cc_generic_services = false;
option optimize_for = SPEED;

message CMsgChildProcessQueryResponse {
    oneof response {
        CMsgChildProcessQueryGpuTopology gpu_topology = 1;
        CMsgChildProcessQueryEnumerateHostAppsLinux host_apps = 2;
        CMsgChildProcessQueryGetHostAppLinux host_app = 3;
    }
}

message CMsgChildProcessQueryGpuTopology {
    repeated GpuInfo gpus = 1;
    message GpuInfo {
        optional uint32 id = 1;
        optional string name = 2;
        optional uint64 vram_size_bytes = 3;
        optional EGpuDriverId driver_id = 4;
        optional int32 driver_version_major = 5;
        optional int32 driver_version_minor = 6;
        optional int32 driver_version_patch = 7;
        optional uint64 luid = 8;
    }
    
    optional uint32 default_gpu_id = 2;
}

message CMsgHostAppInfo {
    optional string name = 1;
    optional string path_exe = 2;
    repeated string args = 3;
    optional string path_shortcut = 4;
    optional string icon_name = 5;
    optional bool is_terminal = 6;
}

message CMsgChildProcessQueryEnumerateHostAppsLinux {
    repeated CMsgHostAppInfo apps = 1;
}

message CMsgChildProcessQueryGetHostAppLinux {
    optional CMsgHostAppInfo app = 1;
}

enum EChildProcessQueryCommand {
    k_EChildProcessQueryCommand_Invalid = 0;
    k_EChildProcessQueryCommand_GpuTopology = 1;
    k_EChildProcessQueryCommand_EnumerateHostAppsLinux = 2;
    k_EChildProcessQueryCommand_GetHostAppLinux = 3;
    k_EChildProcessQueryCommand_Max = 4;
}
